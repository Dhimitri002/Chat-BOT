# 🌸 Flora Platform — Docker Compose
# Uso: docker compose up -d

version: "3.9"

services:
  # =============================================
  # BACKEND — FastAPI REST API
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flora-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://flora:${DB_PASSWORD:-flora_secret}@postgres:5432/flora_platform
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./whatsapp_sessions:/app/whatsapp_sessions
      - ./uploads:/app/uploads
    networks:
      - flora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================
  # POSTGRESQL — Banco de Dados
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: flora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flora_platform
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flora_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - flora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora -d flora_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # REDIS — Cache e Sessões
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: flora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flora_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flora-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-flora_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # PROMETHEUS — Métricas (opcional)
  # =============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: flora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - flora-network
    profiles:
      - monitoring

  # =============================================
  # GRAFANA — Dashboards (opcional)
  # =============================================
  grafana:
    image: grafana/grafana:latest
    container_name: flora-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - flora-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local

networks:
  flora-network:
    driver: bridge
