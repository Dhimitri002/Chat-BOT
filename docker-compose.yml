# =============================================
# FLORA PLATFORM - Docker Compose
# =============================================

version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
    depends_on:
      - db
      - redis
    command: >
      sh -c "python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - flora-net

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flora_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flora-net

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - flora-net

  # WhatsApp Connector (Node.js)
  whatsapp-connector:
    build: ./whatsapp-connector
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./whatsapp-connector:/app
      - /usr/src/app/node_modules
    depends_on:
      - redis
    networks:
      - flora-net

  # Celery Worker (for background tasks)
  worker:
    build: .
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend
      - db
      - redis
    command: celery -A backend.core.celery_app worker --loglevel=info
    networks:
      - flora-net

  # Celery Beat (for periodic tasks)
  beat:
    build: .
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend
      - db
      - redis
    command: celery -A backend.core.celery_app beat --loglevel=info
    networks:
      - flora-net

  # Flower (Celery monitoring)
  flower:
    build: .
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - backend
      - redis
    command: celery -A backend.core.celery_app flower
    networks:
      - flora-net

networks:
  flora-net:
    driver: bridge

volumes:
  postgres_data: